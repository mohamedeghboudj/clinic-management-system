name: Dependency security

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip_audit --requirement requirements.txt
      - run: python -m pip_audit --requirement requirements-dev.txt --disable-pip
